name: Token Factory review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Herdr UI previews]
    types: [completed]

permissions: {}

jobs:
  code:
    name: Review code changes
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft && vars.NEBIUS_MODEL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: token-factory-code-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This is the trusted base commit of pull_request_target, never the PR tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B .github/ci/review.py code
        env:
          GH_TOKEN: ${{ github.token }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NEBIUS_BASE_URL: ${{ vars.NEBIUS_BASE_URL }}
          NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL }}

  visual:
    name: Compare screenshots
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: token-factory-visual-${{ github.event.workflow_run.id }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # workflow_run executes from the default branch. The artifact is read as data only.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B .github/ci/review.py visual
        env:
          GH_TOKEN: ${{ github.token }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NEBIUS_BASE_URL: ${{ vars.NEBIUS_BASE_URL }}
          NEBIUS_VISUAL_MODEL: ${{ vars.NEBIUS_VISUAL_MODEL }}
